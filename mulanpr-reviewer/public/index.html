    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Theme Initialization Script (Prevents flash of dark/light theme) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mulanpr_theme');
          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
</head>
<body>
    <div id="app"></div>
    <script src="/bundle.js"></script>
</body>
